plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.android.pushme'
    compileSdk 35

    defaultConfig {
        applicationId "com.android.pushme"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "5.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }
        resourceConfigurations += ['en', 'zh']

    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
//            ndk {
//                abiFilters "armeabi-v7a"
////                abiFilters "arm64-v8a"
//            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '2.1.0'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    buildToolsVersion '35.0.0'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui:1.8.3'
    implementation 'androidx.compose.ui:ui-graphics:1.8.3'
    implementation 'androidx.compose.ui:ui-util:1.8.3'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.8.3'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material:1.8.3'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.compose.animation:animation:1.8.3'

    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.datastore:datastore-preferences-core:1.1.7'

    implementation('androidx.room:room-runtime:2.7.2')
    implementation('androidx.room:room-ktx:2.7.2')
    implementation 'androidx.work:work-runtime-ktx:2.10.2'
    ksp('androidx.room:room-compiler:2.7.2')

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.1'

    implementation('androidx.compose.runtime:runtime:1.8.3')

    implementation 'com.google.code.gson:gson:2.13.1'

    implementation('org.commonmark:commonmark:0.24.0')
    implementation('org.commonmark:commonmark-ext-gfm-tables:0.24.0')
    implementation('org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0')
    implementation('org.commonmark:commonmark-ext-autolink:0.24.0')
    implementation('org.commonmark:commonmark-ext-task-list-items:0.24.0')

    implementation('io.coil-kt:coil-compose:2.7.0')
    implementation("io.coil-kt:coil-svg:2.7.0")

    implementation files('libs/org.eclipse.paho.client.mqttv3-1.2.5.jar')

    implementation 'io.github.taoweiji.quickjs:quickjs-android:1.4.6'
    implementation('com.squareup.okhttp3:okhttp:4.12.0')
    implementation 'com.github.getActivity:XXPermissions:28.2'

    implementation 'io.mhssn:colorpicker:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.8.3'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.8.3'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.8.3'
}