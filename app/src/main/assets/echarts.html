<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>echarts</title>
    <style>
        * {box-sizing: border-box; padding: 0; margin: 0;}
        html,body,main {width: 100%; height: 100%;}
    </style>
</head>
<body>
<div id="main"></div>
<script src="echarts.min.js"></script>
<script>
    (function(){
        const main = document.getElementById('main');
        main.style.height = document.documentElement.clientHeight + 'px';
        const chart = echarts.init(main);
        window.addEventListener('resize', () => {
            main.style.height = document.documentElement.clientHeight + 'px';
            chart.resize();
        });
        window.setOption = (optStr) => {
            console.log('window.setOption', optStr);
            try {
                const option = typeof optStr == 'string' ? JSON.parse(optStr) : optStr;
                chart.setOption(option);
            } catch(e) {
                window.Android && window.Android.showToast('出错了:' + e.toString());
            }
        }
        window.Android && window.Android.invoke('setOption');
    })();
</script>
</body>
</html>
